name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` doesn't fail when Supabase client code
      # runs during the build/prerender step. Real values live in each
      # deploy target's own env config, never in CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `next build` runs full TypeScript type-checking itself as part of
      # the build (it also generates route types like LayoutProps that a
      # standalone `tsc --noEmit` can't see on a clean checkout), so there's
      # no separate typecheck step.
      - run: npm run build

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Spins up the full local stack (Postgres + Auth + ...) in Docker,
      # applies supabase/migrations/, then runs the pgTAP suite in
      # supabase/tests/ against it. Ephemeral: nothing here touches a real
      # deployed database, and the container is discarded when the job ends.
      - run: supabase start
      - run: supabase test db
